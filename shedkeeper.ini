# shedkeeper settings. One `key = value` per line; `#` starts a comment.
# A line that is not understood does not stop anything: the SAFE value is used and the reason is
# printed by `python shedkeeper.py status` and by every shedkeeper.py command.
# The values below are the defaults.
#
# This file DESCRIBES each setting for you: `python shedkeeper.py settings` prints the comment above each key. How heavy a change is
# (protection = a value can stop protecting something; tuning = a limit or a place, protection stays; notice = only what you are told)
# is decided by the CODE of the kit (config.WEIGHTS), not by this file; the `@weight` lines below repeat it for you to read, and a test
# of the kit fails when they differ from the code. Change a setting with `python shedkeeper.py set KEY VALUE` (checked, logged,
# shown to the person); your own settings live in ~/.shedkeeper/shedkeeper.ini, which is read AFTER this file and which an update of the
# kit does not overwrite. If the environment variable SHEDKEEPER_INI names a file, ONLY that file is read.
# No setting lets an action through after a copy was TRIED and FAILED with an error; the only way past is db_protection = false.
# One exception is named here so that nobody is surprised: on_db_too_large = allow also lets through a database copy that did not
# finish in time (the dump, or the check of it, was cut off by db_deadline_s) -- "too slow to copy" counts as "too big to copy".

# Name of the store folder on each volume: <X>:\<store_dir_name>. A folder with this name that is not
# ours (no .shedkeeper-store label) and has content is never touched: shedkeeper refuses and tells you to
# `python shedkeeper.py adopt X:` it or to change this name. Weight protection: after a change the old store folders are no longer
# guarded as the store, so a change needs the confirmation code like any weakening.
# @weight protection -- the folders of the store under the old name are no longer guarded as the store (the copies and the trash there become ordinary folders an agent may change), and a new, empty store is used from now on
store_dir_name = _shedkeeper

# Create the store by itself on the first use of a volume. Only on a fixed volume: a removable or
# network volume is refused (the store would leave with the medium). Not understood -> false.
# @weight tuning
auto_create_store = true

# Close the personal folder <X>:\<store_dir_name>\<your login name> to every other user of the machine:
# only you and SYSTEM may open it (the folder is CREATED already closed, and the permissions are read
# back to make sure they took -- if they did not, the folder is not made and the change is refused).
#   true  -- closed (default)
#   false -- the folder keeps the permissions it inherits (for a volume without permissions, such as
#            exFAT, or if you want it open); `status` then says "private: no (private_store = false)"
# Not understood -> true (the safe side).
# @weight protection [false] -- the copies and the trash of this user are no longer closed to the other users of the machine
private_store = true

# A file bigger than this many megabytes gets no copy before it changes.
# @weight tuning
max_copy_mb = 512

# What to do about such a file:
#   deny  -- the change is refused, with the name of this setting in the message (safe default)
#   allow -- the change goes ahead without a copy; a line is written to <store>\log.jsonl
# Not understood -> deny.
# @weight protection [allow] -- a change of a file bigger than max_copy_mb goes ahead WITHOUT a copy (a line is written to the log)
on_too_large = deny

# One shell command may overwrite at most this many existing files. Beyond the ceiling the command is REFUSED (never
# silently skipped): a mask that names more files than the ceiling, or a recursive copy that overwrites more, is refused
# before any copy is made.
# @weight tuning
cmd_max_files = 200

# The copies of the files of one shell command may take at most this many seconds in total; beyond it the command is
# REFUSED. Why 20: the hooks are installed with a timeout of 90 s (install.py), and by the Claude Code contract a
# hook that times out lets the action through, unprotected. The hook spends at most cmd_deadline_s on
# copies plus at most 10 s on git calls (two calls of 5 s at most, all together) plus at most db_deadline_s
# on the copies of databases (below), which leaves about 32 s of margin inside the installed timeout
# (90 s > 20 + 10 + 25 + the start of the interpreter, about 3 s). The first creation of a store may also wait
# up to 3 s for its creation lock (outside the budgets), so about 29 s of the margin remain. If you raise
# cmd_deadline_s or db_deadline_s, raise the timeout in the settings by the same amount: TIMEOUT_S in install.py (then install again) for the install.py way, or
# `timeout` in hooks/hooks.json of the plugin (an update of the plugin replaces that file).
# @weight protection [>default] -- if the budgets of the hook (cmd_deadline_s + 10 + db_deadline_s + 3) now add up to more than its timeout (90 s), the hook can be cut off and then the action goes ahead UNPROTECTED
cmd_deadline_s = 20

# ---- databases (PostgreSQL and SQLite) -------------------------------------------------------------
# A command that DESTROYS data in a database (DROP DATABASE/SCHEMA/TABLE, TRUNCATE, DELETE or UPDATE without
# WHERE, ALTER TABLE ... DROP COLUMN, dropdb, pg_restore --clean, `prisma migrate reset`, `rails db:drop` ...) gets
# a verified dump of that database BEFORE it runs; a database that cannot be copied is not destroyed.

# Guard the databases at all.
#   true  -- on (default)
#   false -- off: such commands pass without a copy; `status` says so
# Not understood -> true.
# @weight protection [false] -- databases are NOT protected at all: a command that destroys data in a database goes ahead with no copy
db_protection = true

# The pg_dump to use: a file, or the folder it lies in. Empty = look for it: PATH, then the usual places
# (Windows %ProgramFiles%\PostgreSQL\*\bin, Homebrew, Postgres.app, /usr/lib/postgresql/*/bin), the newest.
# A pg_dump older than the server cannot dump it: then name a newer one here. Weight protection: ShedKeeper also takes pg_restore (the
# check of the copy) and psql (the size) from beside the file named here, so a program that is not the real one would report copies
# and checks of nothing; a change needs the confirmation code like any weakening.
# @weight protection [*] -- the copy of a PostgreSQL database and the check of it are made by the program this setting names: a program that is not the real pg_dump (with its pg_restore and psql beside it) can report a copy and a check that are NOT real
pg_dump_path =

# A database bigger than this many megabytes (measured BEFORE the copy) gets no copy from the hook. What the hook does then is
# on_db_too_large. The explicit `dbcopy` command has no such limit. Why 200: a dump of a 248 MB database took 9 s on the machine of
# the authors (~26 MB/s), so 200 MB is ~8 s.
# @weight tuning
max_db_mb = 200

# A copy of a database that does not finish in this many seconds (the dump and the check of it together, all the copies of one
# command together) is thrown away; what the hook does then is on_db_too_large. The explicit `dbcopy` command has no such limit.
# Why 25: about three times the ~8 s of a 200 MB database.
# @weight protection [>default] -- if the budgets of the hook (cmd_deadline_s + 10 + db_deadline_s + 3) now add up to more than its timeout (90 s), the hook can be cut off and then the action goes ahead UNPROTECTED
db_deadline_s = 25

# A database bigger than max_db_mb, or one the copy of which did not fit db_deadline_s:
#   deny  -- the command is refused, with the READY command that takes the copy outside the limits (default)
#   allow -- the command goes ahead without a copy; a line is written to <store>\log.jsonl. This also lets through a copy that did not
#            finish in time (the dump or its check was cut off by db_deadline_s).
# Not understood -> deny.
# @weight protection [allow] -- a command that destroys a big database (or one that is slow to copy: a copy that did not finish in time) goes ahead WITHOUT a copy (a line is written to the log)
on_db_too_large = deny

# A database on another machine (the host is not localhost / 127.0.0.1 / ::1 / a socket folder; a private network is
# "another machine" too):
#   deny  -- the command is refused, with the ready `dbcopy` command (default)
#   allow -- the command goes ahead without a copy; a line is written to <store>\log.jsonl
# Not understood -> deny.
# @weight protection [allow] -- a command that destroys data in a database on another machine goes ahead WITHOUT a copy (a line is written to the log)
on_db_remote = deny

# A database of an engine this version does not copy (MySQL, MariaDB, SQL Server, MongoDB ... -- named by Rails `mysql2`,
# Laravel `mysql`, Prisma `mysql`, an address `mysql://...`, an MCP server): ShedKeeper can name the engine but cannot take a
# copy. What then:
#   allow -- the command goes ahead; the person and the agent get a loud warning that NO COPY was taken (default); the warning
#            is given once for a project and an engine, afterwards such a command passes quietly with a line in the log
#   deny  -- the command is refused (take a copy yourself first, or build an adapter: README, "Adding another database engine")
# Not understood -> deny.
# @weight protection [allow] -- a command that destroys data in a database of an engine ShedKeeper cannot copy (MySQL ...) goes ahead WITHOUT a copy, after one warning per project
on_db_unsupported = allow

# A verified copy taken by `dbcopy` is good for this many minutes: the same command repeated within that time
# passes with no new copy (this is how the ready commands of a refusal work).
# @weight protection [>default] -- an older `dbcopy` copy still counts as fresh, so a command may pass on a copy made before the data last changed
db_fresh_minutes = 10

# Calls of MCP tools (mcp__<server>__<tool>) are guarded when the tool name holds drop / delete / reset / truncate / wipe / purge AND
# either the name itself names an object of a database (database, db, table, schema, branch, collection, index, bucket: `delete_database`,
# `reset_branch`, `drop_table`), whatever the server, or the server is a server of a DATABASE; a call whose argument holds destroying SQL
# is guarded for every server. A server that has NO database at all (a chat, a tracker, a calendar) is not a server of a database when its
# settings give no database address and neither its name, command nor address holds a word of a database (postgres, pg, sqlite, supabase,
# neon, mysql, maria, mongo, redis, turso, libsql, planetscale, cockroach, duckdb, firebase, firestore, convex, appwrite, d1, prisma, db,
# sql, database): its `delete_message`, `delete_file` ... tools pass. A tool of another kind that carries an object word (`delete_branch`
# of a code-hosting server) is stopped too: this line is the way out. It names servers that pass in every case (the name as in the
# settings of the server; one line, several names separated by spaces or commas, or several lines). Default: none.
#     mcp_no_db = slack linear
# @weight protection [*] -- the calls of the named servers pass WITHOUT a stop, also the ones that destroy data in a database behind them
mcp_no_db =

# More destroying commands of tools (one line each, as many lines as you like). Format:
#     db_command = word word word [| --flag --flag]
# The words are the first words of the command (npx, pnpm exec, yarn, bundle exec, python, php in front of it are
# ignored); with `|` at least one of the flags must be there as well. Built in: prisma, supabase, rails/rake,
# manage.py, alembic, artisan, typeorm, drizzle-kit, sequelize, docker volume rm/prune and compose down -v. Examples:
#     db_command = flyway clean
#     db_command = dotnet ef database drop | --force
# `set db_command "flyway clean"` adds one such line (it never removes one).
# @key db_command
# @weight notice

# ---- the check before every step (the protected list, `python shedkeeper.py protect show`) -----------------------------------------
# Before every step of the agent that can change something, ShedKeeper compares each entry of the list YOU confirmed with the state of its last copy, and copies
# what changed (or what it cannot tell). These keys set the time and the size of that check. The limits of file and database sizes are max_copy_mb /
# on_too_large and max_db_mb / on_db_too_large above.

# The seconds the whole check of one step may take (all the entries together, the copies included). A copy that does not fit refuses the step, with the way on:
# take the copy yourself in your own terminal (`python shedkeeper.py snapshot`). Why 60: the hook is installed with a timeout of 90 s, and a hook that times
# out lets the step through unprotected; 60 leaves 30 s for what the hook does after the check (the copies before a command, a database copy).
# @weight protection [>default] -- the check before a step may now run longer than the hook is allowed to (90 s with the file copies and the database copies of the accelerators); the hook can be cut off and then the step goes ahead UNPROTECTED
step_budget_s = 60

# A walk of a tree that takes more than this many milliseconds is an EXPENSIVE check (the survey says so and you choose: check anyway, exclude folders, or leave the
# tree to the recognised commands). Measured: 200 000 files in about 0,35 s.
# @weight tuning
walk_budget_ms = 3000

# On a volume with the change journal on, so many changed files under the root (more than this) make a full walk cheaper than looking up their paths.
# @weight tuning
usn_resolve_max = 2000

# How many seconds a check waits for another check of the same project (parallel calls, sub-agents, a second Claude Code) before it refuses the step.
# @weight tuning
lock_wait_s = 30

# How many seconds a copy of a SQLite file waits for a writer that holds the file before it refuses the step.
# @weight tuning
sqlite_busy_s = 5

# When the counters of a PostgreSQL database cannot be used (track_counts = off on the server) the database is copied before EVERY step -- only while it is not bigger than
# this many megabytes; a bigger one refuses the step instead (a copy at every step would take too long).
# @weight tuning
max_db_mb_every_step = 50

# What happens BEFORE you confirm the list:
#   accelerators -- nothing is checked before a step; only the recognised destroying commands are guarded (the promise of the list does not apply yet) (default)
#   provisional  -- the candidates of the survey (the project folder, the SQLite files, the local databases found) are checked as a TEMPORARY list, and the start of
#                   every session says that the list is not confirmed
# @weight tuning
before_confirm = accelerators
