# shedkeeper settings. One `key = value` per line; `#` starts a comment.
# A line that is not understood does not stop anything: the SAFE value is used and the reason is
# printed by `python shedkeeper.py status` and by every shedkeeper.py command.
# The values below are the defaults.

# Name of the store folder on each volume: <X>:\<store_dir_name>. A folder with this name that is not
# ours (no .shedkeeper-store label) and has content is never touched: shedkeeper refuses and tells you to
# `python shedkeeper.py adopt X:` it or to change this name.
store_dir_name = _shedkeeper

# Create the store by itself on the first use of a volume. Only on a fixed volume: a removable or
# network volume is refused (the store would leave with the medium). Not understood -> false.
auto_create_store = true

# A file bigger than this many megabytes gets no copy before it changes.
max_copy_mb = 512

# What to do about such a file:
#   deny  -- the change is refused, with the name of this setting in the message (safe default)
#   allow -- the change goes ahead without a copy; a line is written to <store>\log.jsonl
# Not understood -> deny.
on_too_large = deny

# One shell command may overwrite at most this many existing files, and their copies may take at most
# this many seconds in total. Beyond either ceiling the command is REFUSED (never silently skipped):
# a mask that names more files than the ceiling, or a recursive copy that overwrites more, is refused
# before any copy is made.
# Why 20: the hooks are installed with a timeout of 60 s (install.py), and by the Claude Code contract a
# hook that times out lets the action through, unprotected. The hook spends at most cmd_deadline_s on
# copies plus at most 10 s on git calls (two calls of 5 s at most, all together), which leaves about
# 30 s of margin inside the installed timeout (60 s > 20 + 10 + a slow copy of one file + the start of
# the interpreter). If you raise cmd_deadline_s, raise the timeout in the settings by the same amount.
cmd_max_files = 200
cmd_deadline_s = 20
